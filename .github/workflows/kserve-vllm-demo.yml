name: kserve-vllm-demo
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 00 - Env probe (runner CPU + vLLM CPU image sanity)
        run: |
          echo "== runner CPU =="
          lscpu | grep -E 'Model name|Architecture|^Flags' | head -5 || true
          echo "== vLLM CPU image import probe =="
          docker run --rm public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.2 python -c "import faulthandler; faulthandler.enable(); import torch; print('torch', torch.__version__); import vllm; print('vllm', vllm.__version__, 'IMPORT OK')" || echo "PROBE_EXIT=$?"

      - name: 01 - Install kind & kubectl
        run: bash scripts/01-install-tools.sh

      - name: 02 - Create kind cluster
        run: bash scripts/02-create-kind.sh

      - name: 03 - Install KServe (RawDeployment, no Istio/Knative)
        run: bash scripts/03-install-kserve.sh

      - name: 04 - Deploy InferenceService (vLLM + Qwen2.5-0.5B, CPU)
        run: bash scripts/04-deploy-isvc.sh

      - name: 05 - Smoke test OpenAI API
        run: bash scripts/05-smoke-test.sh

      - name: 06 - Collect trace
        if: always()
        run: |
          kubectl get isvc,deploy,svc,pods -A -o wide 2>/dev/null || true
          kubectl get isvc qwen-vllm -n default -o yaml 2>/dev/null | head -80 || true
          kubectl logs deploy/qwen-vllm-predictor -n default --tail=40 2>/dev/null || true
          kubectl logs deploy/kserve-controller-manager -n kserve -c manager --tail=60 2>/dev/null || true
          kubectl describe isvc qwen-vllm -n default 2>/dev/null | tail -30 || true