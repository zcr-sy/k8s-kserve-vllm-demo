apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-vllm
  namespace: default
spec:
  # 自定义容器(containers) + RawDeployment: 不声明协议, KServe 只负责编排 Deployment/Service;
  # 冒烟测试直接 port-forward 打 vLLM 自带的 OpenAI 端口, 不走 KServe 协议层, 规避 v1/v2 争议
  predictor:
    containers:
      - name: vllm
        # 统一镜像: GPU/CPU 都可跑, 用 --device cpu 切到 CPU 后端
        image: vllm/vllm-openai:v0.9.2
        args:
          - --model
          - Qwen/Qwen2.5-0.5B-Instruct
          - --device
          - cpu
          - --served-model-name
          - qwen
          - --max-model-len
          - "2048"
        # 若执行环境无法直连 huggingface.co, 取消下面注释走镜像站:
        # env:
        #   - name: HF_ENDPOINT
        #     value: https://hf-mirror.com
        ports:
          - containerPort: 8000
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 20
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi