apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-vllm
  namespace: default
spec:
  # 自定义容器(containers) + RawDeployment: 不声明协议, KServe 只负责编排 Deployment/Service;
  # 冒烟测试直接 port-forward 打 vLLM 自带的 OpenAI 端口, 不走 KServe 协议层, 规避 v1/v2 争议
  predictor:
    containers:
      - name: vllm
        # 官方 CPU 构建 (AWS ECR Public, vLLM 文档指定仓库); 默认 vllm-openai 镜像是 CUDA 专用, --device cpu 会 Failed to infer device type
        image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:v0.9.2
        args:
          - --model
          - Qwen/Qwen2.5-0.5B-Instruct
          - --device
          - cpu
          - --served-model-name
          - qwen
          - --max-model-len
          - "2048"
        # 若执行环境无法直连 huggingface.co, 取消下面注释走镜像站:
        # env:
        #   - name: HF_ENDPOINT
        #     value: https://hf-mirror.com
        env:
          # 缩小 KV cache 占用 (GiB), 0.5B 模型 + 2048 长度 1GiB 足够, 防预热阶段 OOM(SIGKILL 137)
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        ports:
          - containerPort: 8000
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 20
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi